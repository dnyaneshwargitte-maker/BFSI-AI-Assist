# =============================================================================
# CloudifyOps BFSI Intelligence Platform – Nginx Reverse Proxy
# HTTPS required for WebRTC microphone (getUserMedia) over public IP
# SSL certs provisioned by Certbot → Let's Encrypt via sslip.io
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP (port 80) – ACME challenge + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Certbot ACME challenge (needed for initial cert issuance)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirect all HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS (port 443) – Main application server
# TLS certs are mounted from /etc/letsencrypt (see docker-compose.yml)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # SSL certificate (issued by: certbot certonly --standalone -d YOUR_DOMAIN)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Generous timeouts for WebSocket/WebRTC signaling
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;

    # -------------------------------------------------------------------------
    # WebSocket Signaling – /ws/* (WebRTC SDP + ICE, LCA stream)
    # -------------------------------------------------------------------------
    location /ws/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # -------------------------------------------------------------------------
    # REST API – /api/*
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # CloudifyOps Logo
    # -------------------------------------------------------------------------
    location = /cloudifyops_logo.png {
        alias /usr/share/nginx/html/cloudifyops_logo.png;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # Customer Portal
    # -------------------------------------------------------------------------
    location = /customer {
        root /usr/share/nginx/html;
        try_files /customer.html =404;
    }

    # -------------------------------------------------------------------------
    # Agent Portal
    # -------------------------------------------------------------------------
    location = /agent {
        root /usr/share/nginx/html;
        try_files /agent.html =404;
    }

    # -------------------------------------------------------------------------
    # Frontend SPA / Root
    # -------------------------------------------------------------------------
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
}
